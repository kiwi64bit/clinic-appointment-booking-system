<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Clinic Appointment Booking System (CABS) - Plain HTML/CSS/Vanilla JS Healthcare Scheduling">
  <title>Clinic Appointment Booking System (CABS)</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- Application Header / Navigation -->
    <header class="cabs-header">
      <div id="header-container" class="header-container">
        <!-- Rendered dynamically by app.js -->
      </div>
    </header>

    <!-- Main Viewport for Current Route Page -->
    <main id="main-viewport" class="main-viewport" role="main" aria-live="polite">
      <!-- Views injected here by SPA router -->
    </main>

    <!-- Accessible Global Footer -->
    <footer style="margin-top: auto; border-top: 1px solid var(--border-light); background: var(--bg-surface); padding: 1.5rem 1rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
      <div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.75rem;">
        <div>
          <strong>Clinic Appointment Booking System (CABS)</strong> &bull; Pure Vanilla Web Application
        </div>
        <div>
          <span>Storage: LocalStorage DB</span> &bull; <span>Crypto: Web Crypto SHA-256</span>
        </div>
      </div>
    </footer>
  </div>

  <!-- Scripts in dependency order (No build step, runs directly by opening index.html) -->
  <script src="js/models.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/services.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/authView.js"></script>
  <script src="js/views/patientViews.js"></script>
  <script src="js/views/doctorViews.js"></script>
  <script src="js/views/adminViews.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
